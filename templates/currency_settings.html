{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h2>Currency Settings</h2>

    <p>
        Choose the currency you want to use throughout FinTrack.
    </p>

    <form method="POST">

        {% csrf_token %}

        <label for="currency">
            Preferred Currency:
        </label>

        <select
            name="currency"
            id="currency"
        >

            {% for code, name in currency_choices %}

                <option
                    value="{{ code }}"
                    {% if profile.currency == code %}
                        selected
                    {% endif %}
                >
                    {{ name }}
                </option>

            {% endfor %}

        </select>

        <br><br>

        <button type="submit">
            Save Currency
        </button>

    </form>

    <br>

    <a href="{% url 'dashboard' %}">
        ← Back to Dashboard
    </a>

</div>

{% endblock %}
