{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FinTrack</title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

</head>

<body>

    <!-- ==============================
         HEADER
    =============================== -->

    <header>

        <h1>FinTrack</h1>

        <!-- ==============================
             NAVIGATION
        =============================== -->

        <nav>

            <a href="{% url 'dashboard' %}">
                Dashboard
            </a>

            <a href="{% url 'transactions' %}">
                Transactions
            </a>

            <a href="{% url 'add_transaction' %}">
                Add Transaction
            </a>

            <a href="{% url 'currency_settings' %}">
                Currency Settings
            </a>


            <!-- ==============================
                 LOGIN / LOGOUT
            =============================== -->

            {% if user.is_authenticated %}

                <form
                    action="{% url 'logout' %}"
                    method="post"
                    style="display: inline;"
                >

                    {% csrf_token %}

                    <button type="submit">
                        Logout
                    </button>

                </form>

            {% else %}

                <a href="{% url 'login' %}">
                    Login
                </a>

            {% endif %}

        </nav>

    </header>


    <!-- ==============================
         MAIN CONTENT
    =============================== -->

    <main>

        {% block content %}

        {% endblock %}

    </main>


</body>

</html>
